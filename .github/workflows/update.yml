name: Aktualizace dat o nehodách

on:
  schedule:
    # 5. a 20. den v měsíci v 6:23 UTC (data CDV se aktualizují jednou měsíčně)
    - cron: "23 6 5,20 * *"
  workflow_dispatch: {}   # ruční spuštění tlačítkem „Run workflow“

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout a zpracovat data
        run: python update_data.py

      - name: Uložit změny a znovu sestavit web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Beze změn."
          else
            git commit -m "Aktualizace dat o nehodách"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
